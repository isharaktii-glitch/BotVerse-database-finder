<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - BotVerse</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0B0F1A;
    --bg-elevated: #131926;
    --violet: #7C5CFF;
    --teal: #2DD4BF;
    --text: #F5F3FF;
    --muted: #8B93A7;
    --border: rgba(255,255,255,0.08);
    --error: #FF6B6B;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }

  h1, h2 { font-family: 'Space Grotesk', sans-serif; }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot {
    width: 10px; height: 10px;
    background: var(--violet);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--violet);
  }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .business-name { font-size: 14px; color: var(--muted); }
  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .layout {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px;
  }

  .upload-section {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .upload-section h2 { font-size: 17px; margin-bottom: 4px; }
  .upload-section .desc { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .source-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .source-tab {
    background: none;
    border: none;
    color: var(--muted);
    padding: 10px 4px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-right: 16px;
  }
  .source-tab.active { color: var(--text); border-bottom-color: var(--violet); }

  .source-panel { display: none; }
  .source-panel.active { display: block; }

  .upload-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .file-label {
    background: var(--violet);
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-block;
  }
  .file-label input { display: none; }
  .file-status { font-size: 13px; color: var(--muted); }

  .link-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .link-row input {
    flex: 1;
    min-width: 200px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
  }
  .link-row input:focus { outline: none; border-color: var(--violet); }
  .link-btn {
    background: var(--violet);
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .link-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .link-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .data-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(45,212,191,0.1);
    border: 1px solid rgba(45,212,191,0.3);
    color: var(--teal);
    padding: 6px 12px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 14px;
  }
  .data-badge::before { content: '●'; }

  .error-text {
    color: var(--error);
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }
  .error-text.show { display: block; }

  .chat-section {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    height: 500px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    max-width: 280px;
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 12px; }

  .bubble {
    max-width: 80%;
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 14px;
  }
  .bubble.user {
    background: var(--violet);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    background: rgba(255,255,255,0.06);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    white-space: pre-wrap;
  }
  .bubble.bot.loading { color: var(--muted); font-style: italic; }

  .chat-input-row {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid var(--border);
  }
  .chat-input-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
  }
  .chat-input-row input:focus { outline: none; border-color: var(--violet); }
  .chat-input-row input:disabled { opacity: 0.5; }
  .send-btn {
    background: var(--violet);
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-dot"></span>BotVerse</div>
  <div class="header-right">
    <span class="business-name" id="businessName">Loading...</span>
    <button class="logout-btn" id="logoutBtn">Log out</button>
  </div>
</header>

<div class="layout">
  <div class="upload-section">
    <h2>Your business data</h2>
    <p class="desc">Connect a data source to start asking questions.</p>

    <div class="source-tabs">
      <button class="source-tab active" data-tab="file">File</button>
      <button class="source-tab" data-tab="sheet">Google Sheet</button>
      <button class="source-tab" data-tab="website">Website</button>
    </div>

    <div class="source-panel active" id="panel-file">
      <div class="upload-row">
        <label class="file-label">
          Choose file
          <input type="file" id="fileInput" accept=".csv,.xlsx,.xls">
        </label>
        <span class="file-status" id="fileStatus">No file uploaded yet</span>
      </div>
    </div>

    <div class="source-panel" id="panel-sheet">
      <div class="link-row">
        <input type="text" id="sheetInput" placeholder="Paste your Google Sheets link">
        <button class="link-btn" id="sheetBtn">Connect</button>
      </div>
      <p class="link-hint">Set sharing to "Anyone with the link can view" first.</p>
    </div>

    <div class="source-panel" id="panel-website">
      <div class="link-row">
        <input type="text" id="websiteInput" placeholder="https://yourbusiness.com">
        <button class="link-btn" id="websiteBtn">Connect</button>
      </div>
      <p class="link-hint">Works best on simple business websites.</p>
    </div>

    <div class="error-text" id="sourceError"></div>
    <div id="dataBadge"></div>
  </div>

  <div class="chat-section">
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state">
        <div class="icon">💬</div>
        Connect your data, then ask a question like "what's my total revenue?"
      </div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Ask about your data..." disabled>
      <button class="send-btn" id="sendBtn" disabled>Ask</button>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('botverse_token');
const userStr = localStorage.getItem('botverse_user');

if (!token || !userStr) {
  window.location.href = '/login.html';
}

const user = JSON.parse(userStr);
document.getElementById('businessName').textContent = user.businessName;

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('botverse_token');
  localStorage.removeItem('botverse_user');
  window.location.href = '/login.html';
});

document.querySelectorAll('.source-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.source-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    hideError();
  });
});

const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const chatMessages = document.getElementById('chatMessages');
const dataBadge = document.getElementById('dataBadge');
const sourceError = document.getElementById('sourceError');

function showError(msg) {
  sourceError.textContent = msg;
  sourceError.classList.add('show');
}
function hideError() {
  sourceError.classList.remove('show');
}
function onDataConnected(label) {
  dataBadge.innerHTML = '<div class="data-badge">' + label + '</div>';
  chatInput.disabled = false;
  sendBtn.disabled = false;
  chatMessages.innerHTML = '';
  hideError();
}

const fileInput = document.getElementById('fileInput');
const fileStatus = document.getElementById('fileStatus');

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  fileStatus.textContent = 'Uploading...';
  const isExcel = file.name.endsWith('.xlsx') || file.name.endsWith('.xls');
  const reader = new FileReader();

  reader.onload = async (event) => {
    let data;
    try {
      if (isExcel) {
        const workbook = XLSX.read(event.target.result, { type: 'binary' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        data = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
      } else {
        const csvText = event.target.result;
        const rows = csvText.split('\n').filter(r => r.trim());
        const headers = rows[0].split(',').map(h => h.trim());
        data = rows.slice(1).map(row => {
          const values = row.split(',');
          const obj = {};
          headers.forEach((h, i) => { obj[h] = values[i] ? values[i].trim() : ''; });
          return obj;
        });
      }
    } catch (err) {
      fileStatus.textContent = 'Could not read that file.';
      return;
    }

    try {
      const res = await fetch('/api/upload-data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ dataName: file.name, data })
      });
      const result = await res.json();
      if (!res.ok) { fileStatus.textContent = 'Upload failed: ' + (result.error || ''); return; }
      fileStatus.textContent = file.name;
      onDataConnected(data.length + ' rows loaded');
    } catch (err) {
      fileStatus.textContent = 'Upload failed. Please try again.';
    }
  };

  if (isExcel) reader.readAsBinaryString(file);
  else reader.readAsText(file);
});

const sheetInput = document.getElementById('sheetInput');
const sheetBtn = document.getElementById('sheetBtn');

sheetBtn.addEventListener('click', async () => {
  const sheetUrl = sheetInput.value.trim();
  if (!sheetUrl) return;
  hideError();
  sheetBtn.disabled = true;
  sheetBtn.textContent = 'Connecting...';

  try {
    const res = await fetch('/api/add-sheet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ sheetUrl })
    });
    const result = await res.json();
    if (!res.ok) { showError(result.error || 'Could not connect that sheet.'); }
    else { onDataConnected(result.rowCount + ' rows loaded from Google Sheet'); }
  } catch (err) {
    showError('Could not connect. Please try again.');
  }

  sheetBtn.disabled = false;
  sheetBtn.textContent = 'Connect';
});

const websiteInput = document.getElementById('websiteInput');
const websiteBtn = document.getElementById('websiteBtn');

websiteBtn.addEventListener('click', async () => {
  const url = websiteInput.value.trim();
  if (!url) return;
  hideError();
  websiteBtn.disabled = true;
  websiteBtn.textContent = 'Connecting...';

  try {
    const res = await fetch('/api/add-website', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ url })
    });
    const result = await res.json();
    if (!res.ok) { showError(result.error || 'Could not connect that website.'); }
    else { onDataConnected('Website connected'); }
  } catch (err) {
    showError('Could not connect. Please try again.');
  }

  websiteBtn.disabled = false;
  websiteBtn.textContent = 'Connect';
});

function addBubble(text, type) {
  const emptyState = chatMessages.querySelector('.empty-state');
  if (emptyState) emptyState.remove();
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + type;
  bubble.textContent = text;
  chatMessages.appendChild(bubble);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return bubble;
}

async function sendQuestion() {
  const question = chatInput.value.trim();
  if (!question) return;

  addBubble(question, 'user');
  chatInput.value = '';
  sendBtn.disabled = true;
  chatInput.disabled = true;

  const loadingBubble = addBubble('Thinking...', 'bot loading');

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ question })
    });
    const result = await res.json();
    loadingBubble.remove();
    if (!res.ok) addBubble(result.error || 'Something went wrong.', 'bot');
    else addBubble(result.answer, 'bot');
  } catch (err) {
    loadingBubble.remove();
    addBubble('Could not connect. Please try again.', 'bot');
  }

  sendBtn.disabled = false;
  chatInput.disabled = false;
  chatInput.focus();
}

sendBtn.addEventListener('click', sendQuestion);
chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendQuestion(); });
</script>

</body>
</html>
